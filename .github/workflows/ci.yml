name: CI

# The repo had no CI that checked anything. The only workflow built and
# deployed to a decommissioned Azure Static Web App and ran no tests, so it
# reported success on every push while verifying nothing — which is how the
# frontend and backend copies of the same rules drifted apart unnoticed and
# produced a fortnight of user-reported bugs.
#
# This runs the checks that would have caught them, in particular the contract
# and role-parity tests in backend/src/lib.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — types, lint, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        # Includes the guardrails: contracts.test.ts (frontend/backend rules
        # must agree), roleParity.test.ts (a role the UI admits must be able to
        # reach the API), schemaTypes.test.ts (every column type has a decided
        # JS representation).
        run: npx vitest run
      - name: Lint (no NEW errors)
        # The backend carries 190 pre-existing no-explicit-any errors in 37
        # files. Failing on zero would mean this job never passes, so the gate
        # is "no more than today" — tighten the number as the debt is paid
        # down, never loosen it.
        run: |
          COUNT=$(npx eslint src -f json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).reduce((n,f)=>n+f.errorCount,0)))")
          echo "eslint errors: $COUNT (baseline 190)"
          if [ "$COUNT" -gt 190 ]; then
            echo "::error::eslint errors increased to $COUNT (baseline 190)"
            exit 1
          fi

  frontend:
    name: Frontend — types, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type check (no NEW errors)
        # NOT `tsc --noEmit`: the root tsconfig is `"files": []` plus project
        # references, so that form checks ZERO files and passes unconditionally.
        # It silently "passed" over a file with a broken JSX tag. The project
        # form is the only one that actually checks src.
        run: |
          COUNT=$(npx tsc -p tsconfig.app.json --noEmit 2>&1 | grep -c "error TS" || true)
          echo "tsc errors: $COUNT (baseline 4)"
          if [ "$COUNT" -gt 4 ]; then
            echo "::error::frontend type errors increased to $COUNT (baseline 4)"
            npx tsc -p tsconfig.app.json --noEmit 2>&1 | grep "error TS" || true
            exit 1
          fi
      - name: Lint (no NEW errors)
        run: |
          COUNT=$(npx eslint src -f json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).reduce((n,f)=>n+f.errorCount,0)))")
          echo "eslint errors: $COUNT (baseline 120)"
          if [ "$COUNT" -gt 120 ]; then
            echo "::error::eslint errors increased to $COUNT (baseline 120)"
            exit 1
          fi
      - name: Build
        run: npm run build
