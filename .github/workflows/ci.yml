name: CI

# The repo had no CI that checked anything. The only workflow built and
# deployed to a decommissioned Azure Static Web App and ran no tests, so it
# reported success on every push while verifying nothing — which is how the
# frontend and backend copies of the same rules drifted apart unnoticed and
# produced a fortnight of user-reported bugs.
#
# This runs the checks that would have caught them, in particular the contract
# and role-parity tests in backend/src/lib.
#
# Note the split: eslint is installed and configured ONLY at the repo root
# (eslint.config.js; backend/package.json has no eslint dependency and no
# config of its own). So linting BOTH trees belongs to the root job — running
# it from backend/ fails to resolve its plugins.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — types and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        # Includes the guardrails: contracts.test.ts (frontend/backend rules
        # must agree), roleParity.test.ts (a role the UI admits must be able to
        # reach the API), schemaTypes.test.ts (every column type has a decided
        # JS representation).
        run: npx vitest run

  root:
    name: Frontend — types, build; lint both trees
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Frontend type check (no NEW errors)
        # NOT `tsc --noEmit`: the root tsconfig is `"files": []` plus project
        # references, so that form checks ZERO files and passes unconditionally.
        # It silently "passed" over a file with a broken JSX tag. The project
        # form is the only one that actually checks src.
        run: |
          COUNT=$(npx tsc -p tsconfig.app.json --noEmit 2>&1 | grep -c "error TS" || true)
          echo "frontend tsc errors: $COUNT (baseline 4)"
          if [ "$COUNT" -gt 4 ]; then
            npx tsc -p tsconfig.app.json --noEmit 2>&1 | grep "error TS" || true
            echo "::error::frontend type errors increased to $COUNT (baseline 4)"
            exit 1
          fi

      # Gates are "no worse than today", not zero: both trees carry real
      # pre-existing debt, and a gate that can never pass gets switched off.
      # Lower these numbers as the debt is paid down; never raise them.
      - name: Lint frontend (no NEW errors)
        run: |
          COUNT=$(npx eslint src -f json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s||'[]').reduce((n,f)=>n+f.errorCount,0)))")
          echo "frontend eslint errors: $COUNT (baseline 120)"
          [ "$COUNT" -le 120 ] || { echo "::error::frontend eslint errors increased to $COUNT (baseline 120)"; exit 1; }

      - name: Lint backend (no NEW errors)
        run: |
          COUNT=$(npx eslint backend/src -f json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s||'[]').reduce((n,f)=>n+f.errorCount,0)))")
          echo "backend eslint errors: $COUNT (baseline 190)"
          [ "$COUNT" -le 190 ] || { echo "::error::backend eslint errors increased to $COUNT (baseline 190)"; exit 1; }

      - name: Build
        run: npm run build
