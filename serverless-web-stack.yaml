AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Serverless web stack - CloudFront + WAF -> private S3 bucket (OAC) for the
  client-rendered SPA, and API Gateway HTTP API -> backend Lambda (VPC) ->
  RDS PostgreSQL.
  Private subnets only. No internet gateway, no NAT gateway.
  MUST be deployed in us-east-1 (CLOUDFRONT-scope WAF requirement).

Parameters:
  ProjectName:
    Type: String
    Default: joblyportal
    AllowedPattern: '[a-z0-9-]+'
    Description: Lowercase name used as a prefix for resources.

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

  PrivateSubnetACidr:
    Type: String
    Default: 10.0.1.0/24

  PrivateSubnetBCidr:
    Type: String
    Default: 10.0.2.0/24

  DbInstanceClass:
    Type: String
    Default: db.t4g.micro

  DbName:
    Type: String
    Default: appdb
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9]*'

  DbMasterUsername:
    Type: String
    Default: dbadmin
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9_]*'

  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20

  DbDeletionProtection:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to false before you attempt to delete this stack.

  RateLimitPer5Min:
    Type: Number
    Default: 2000
    Description: WAF rate-based rule threshold per IP per 5 minutes.

  DomainName:
    Type: String
    Default: ''
    Description: Optional. Leave blank until the domain is registered.

  HostedZoneId:
    Type: String
    Default: ''
    Description: Optional. Route 53 hosted zone ID for DomainName.

  AcmCertificateArn:
    Type: String
    Default: ''
    Description: Optional. ACM certificate in us-east-1 covering DomainName.

  ApiAuthMode:
    Type: String
    Default: cognito
    AllowedValues: [cognito, application]
    Description: >
      Who authenticates API calls. 'cognito' puts an API Gateway JWT
      authorizer in front of every route. 'application' removes it and relies
      on the Express authenticate middleware instead, which is how the app
      works on Render today. Use 'application' until the Supabase Auth ->
      Cognito migration lands: a Cognito authorizer rejects the Supabase
      tokens the frontend currently sends, so every request 401s.

  SupabaseUrl:
    Type: String
    Default: ''
    Description: >
      Supabase project URL. Still required after the database moves to RDS,
      because Storage (documents) and Auth are separate migration phases.

  SupabaseServiceRoleKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Supabase service-role key, for Storage and Auth only.

  SupabaseAnonKey:
    Type: String
    Default: ''
    NoEcho: true
    Description: Supabase anon key, for Auth only.

  FrontendUrl:
    Type: String
    Default: ''
    Description: >
      Origin allowed by CORS. Leave blank to use the CloudFront distribution
      domain, which is what the SPA is served from.

  EnableScheduler:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Run the daily tick (invoice reminders, expiry alerts, leave-return
      reactivation) from an EventBridge rule. node-cron cannot do this on
      Lambda - the process is frozen between invocations, so the timer never
      fires.

  EnableNatGateway:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Give the private subnets outbound internet access. Required while the
      backend still calls Supabase Auth (login), Supabase Storage (documents)
      and an SMTP provider - all public-internet services. Costs roughly
      $32/month plus data. Set to 'false' once Auth, Storage and mail have
      moved to Cognito, S3 and SES, which are all reachable over VPC
      endpoints.

  PublicSubnetCidr:
    Type: String
    Default: 10.0.10.0/24
    Description: Subnet holding only the NAT gateway. No app resource lives here.

Conditions:
  NatEnabled: !Equals [!Ref EnableNatGateway, 'true']
  UseCognitoAuthorizer: !Equals [!Ref ApiAuthMode, cognito]
  SchedulerEnabled: !Equals [!Ref EnableScheduler, 'true']
  HasFrontendUrl: !Not [!Equals [!Ref FrontendUrl, '']]
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref AcmCertificateArn, '']]
  HasHostedZone: !And
    - !Condition HasDomain
    - !Not [!Equals [!Ref HostedZoneId, '']]

Resources:

  # ----------------------------------------------------------------------
  # Networking. Private subnets only - no IGW, no NAT, no route to 0.0.0.0/0.
  # ----------------------------------------------------------------------

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-a'

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-b'

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-private-rt'

  PrivateSubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # --------------------------------------------------------------------
  # Outbound internet access.
  #
  # The backend still depends on three services that live on the public
  # internet: Supabase Auth (every login), Supabase Storage (every document
  # download) and the SMTP provider. With no route to 0.0.0.0/0 those calls
  # do not fail fast - they hang until the socket times out, which is why a
  # login returned "fetch failed" after 14 seconds rather than an error.
  #
  # This becomes removable once Auth moves to Cognito, Storage to S3 and mail
  # to SES: all three are reachable over VPC endpoints, and the stack can go
  # back to having no internet egress at all. Until then it is load-bearing.
  # --------------------------------------------------------------------

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: NatEnabled
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-igw'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: NatEnabled
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # Holds the NAT gateway only. No application resource is ever placed here,
  # so nothing of ours is directly addressable from the internet.
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: NatEnabled
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-a'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: NatEnabled
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-rt'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    Condition: NatEnabled
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: NatEnabled
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    Condition: NatEnabled
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nat-eip'

  # Single NAT, single AZ. Deliberate: two would double the hourly cost for
  # redundancy the rest of this stack does not have (the RDS instance is
  # also single-AZ). Worth revisiting together, not separately.
  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: NatEnabled
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-nat'

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Condition: NatEnabled
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Backend Lambda ENIs. No inbound.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 127.0.0.1/32
          Description: Placeholder - real egress added by LambdaEgressToRds
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-lambda-sg'

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL. Inbound 5432 from Lambda SG only.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 127.0.0.1/32
          Description: No egress required
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-rds-sg'

  LambdaEgressToRds:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref RdsSecurityGroup
      Description: Postgres to RDS

  # --------------------------------------------------------------------
  # VPC endpoints.
  #
  # The private subnets have no internet gateway and no NAT, so a Lambda in
  # this VPC can reach NOTHING outside it - not Secrets Manager, not S3.
  # Without these endpoints the backend cannot fetch its DB credentials or
  # store a document, which makes the stack unusable for this app.
  # --------------------------------------------------------------------

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Interface VPC endpoints. HTTPS in from Lambda only.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 127.0.0.1/32
          Description: No egress required
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpce-sg'

  VpcEndpointIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref VpcEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: HTTPS from Lambda ENIs

  # Easy to miss: the Lambda SG only had egress to RDS:5432, so even with
  # endpoints present the calls would have been dropped on the way out.
  LambdaEgressToVpcEndpoints:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VpcEndpointSecurityGroup
      Description: HTTPS to interface VPC endpoints

  # Gateway endpoint - no hourly charge, and it needs a route table entry
  # rather than an ENI, so no security group applies.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  # Interface endpoint (~$7/mo) - required for the DB password.
  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  RdsIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: Postgres from backend Lambda (migration Lambda talks direct)

  # --------------------------------------------------------------------
  # RDS Proxy network path: Lambda -> Proxy -> RDS.
  #
  # Lambda scales by creating concurrent execution environments, and each
  # one opens its own Postgres connection. A db.t4g-class instance allows
  # only a few hundred, and every connection costs ~10MB of server RAM, so
  # a traffic spike exhausts them and the API starts returning connection
  # errors. The proxy keeps a warm pool and multiplexes over it, which also
  # removes the TLS+auth handshake (~30-50ms) from most cold invocations.
  # --------------------------------------------------------------------

  DbProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS Proxy ENIs. 5432 in from Lambda, 5432 out to RDS.
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 127.0.0.1/32
          Description: Placeholder - real egress added by ProxyEgressToRds
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-proxy-sg'

  ProxyIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbProxySecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaSecurityGroup
      Description: Postgres from backend Lambda

  ProxyEgressToRds:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref DbProxySecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref RdsSecurityGroup
      Description: Postgres to RDS

  RdsIngressFromProxy:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RdsSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref DbProxySecurityGroup
      Description: Postgres from RDS Proxy

  LambdaEgressToProxy:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DbProxySecurityGroup
      Description: Postgres to RDS Proxy

  # A NAT gateway alone is not enough - this security group only allowed
  # egress to specific groups, so internet-bound packets were dropped before
  # they ever reached the route table. Scoped to the two ports the backend
  # actually needs outbound, not "all traffic".
  LambdaEgressHttps:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: NatEnabled
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
      Description: HTTPS to Supabase Auth and Storage

  LambdaEgressSmtp:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: NatEnabled
    Properties:
      GroupId: !Ref LambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 587
      ToPort: 587
      CidrIp: 0.0.0.0/0
      Description: SMTP submission (STARTTLS) to the mail provider

  # ----------------------------------------------------------------------
  # Database
  # ----------------------------------------------------------------------

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for RDS
      SubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-db'
      Engine: postgres
      DBInstanceClass: !Ref DbInstanceClass
      DBName: !Ref DbName
      MasterUsername: !Ref DbMasterUsername
      ManageMasterUserPassword: true
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      EnableIAMDatabaseAuthentication: true
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      DeletionProtection: !Ref DbDeletionProtection
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups:
        - !Ref RdsSecurityGroup
      AutoMinorVersionUpgrade: true

  # The application connects as app_user, not as the RDS master user.
  # CloudFormation generates the password so it never exists in the repo,
  # in a parameter, or in anyone's shell history; the migration Lambda reads
  # it back out to CREATE ROLE, and the backend reads it to connect.
  AppUserSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/db/app_user'
      Description: Password for the least-privilege application database role
      GenerateSecretString:
        SecretStringTemplate: '{"username":"app_user"}'
        GenerateStringKey: password
        PasswordLength: 40
        # '/', '@', '"', ' ' and '\' break libpq connection strings and URL
        # forms; excluding them keeps the secret usable in every context.
        ExcludeCharacters: '/@" \'

  # Shared secret proving a request actually came through CloudFront.
  #
  # The API Gateway default endpoint is public and cannot be given a resource
  # policy (HTTP APIs do not support them), so every WAF rule in this stack -
  # rate limiting, the managed rule sets, IP reputation - was bypassable by
  # calling the execute-api URL directly. CloudFront injects this header on
  # the origin request and the backend rejects anything without it.
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/api/origin-verify'
      Description: Shared secret that proves a request traversed CloudFront
      GenerateSecretString:
        SecretStringTemplate: '{"header":"x-origin-verify"}'
        GenerateStringKey: value
        PasswordLength: 48
        ExcludePunctuation: true

  DbProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: rds.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-db-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref AppUserSecret
              # Both secrets are encrypted with the AWS-managed
              # aws/secretsmanager key, whose policy cannot be edited. Access
              # is therefore granted here instead, narrowed with ViaService so
              # this role can only decrypt through Secrets Manager.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'

  DbProxy:
    Type: AWS::RDS::DBProxy
    Properties:
      DBProxyName: !Sub '${ProjectName}-proxy'
      EngineFamily: POSTGRESQL
      RoleArn: !GetAtt DbProxyRole.Arn
      RequireTLS: true
      IdleClientTimeout: 1800
      DebugLogging: false
      Auth:
        - AuthScheme: SECRETS
          SecretArn: !Ref AppUserSecret
          IAMAuth: DISABLED
          ClientPasswordAuthType: POSTGRES_SCRAM_SHA_256
          Description: Application role
        # The master secret is registered too so administrative sessions can
        # also go through the proxy rather than around it.
        - AuthScheme: SECRETS
          SecretArn: !GetAtt Database.MasterUserSecret.SecretArn
          IAMAuth: DISABLED
          ClientPasswordAuthType: POSTGRES_SCRAM_SHA_256
          Description: Master role
      VpcSubnetIds:
        - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
      VpcSecurityGroupIds:
        - !Ref DbProxySecurityGroup

  DbProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    Properties:
      DBProxyName: !Ref DbProxy
      # 'default' is the only name RDS Proxy accepts for a target group.
      TargetGroupName: default
      DBInstanceIdentifiers:
        - !Ref Database
      ConnectionPoolConfigurationInfo:
        MaxConnectionsPercent: 90
        MaxIdleConnectionsPercent: 50
        # Wait rather than error when the pool is saturated - a brief queue
        # is far better than a 500 back to the browser.
        ConnectionBorrowTimeout: 120

  # ----------------------------------------------------------------------
  # Cognito
  # ----------------------------------------------------------------------

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-users'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'OPTIONAL'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-web'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs:
        - !If [HasDomain, !Sub 'https://${DomainName}/auth/callback', 'http://localhost:3000/auth/callback']
      LogoutURLs:
        - !If [HasDomain, !Sub 'https://${DomainName}/', 'http://localhost:3000/']
      AccessTokenValidity: 15
      IdTokenValidity: 15
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true

  # ----------------------------------------------------------------------
  # Backend Lambda - VPC attached, reaches RDS
  # ----------------------------------------------------------------------

  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-backend'
      RetentionInDays: 14

  BackendRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        # Connections go through RDS Proxy using the app_user secret, so the
        # backend needs to read that secret and nothing else. It is NOT given
        # the master secret: a leak of this role must not yield superuser.
        - PolicyName: read-app-user-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref AppUserSecret

  BackendFunction:
    Type: AWS::Lambda::Function
    DependsOn: BackendLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-backend'
      Runtime: nodejs22.x
      # dist/lambda.js wraps the same Express app server.ts serves locally.
      Handler: dist/lambda.handler
      Role: !GetAtt BackendRole.Arn
      # API Gateway HTTP API caps an integration at 30s, so there is no point
      # going higher. 15s was tight for PDF/XLSX generation.
      Timeout: 29
      # pdfkit and xlsx are memory-hungry, and Lambda scales CPU with memory -
      # 512MB made exports slow as much as it made them fragile.
      MemorySize: 1024
      # ReservedConcurrentExecutions: 20
      # Disabled: this AWS account is new, so its Lambda concurrency limit is
      # still the default 10 (not 1000). Reserving 20 fails with
      # "decreases account's UnreservedConcurrentExecution below its minimum
      # value of [10]" — and reserving ANY amount breaks that same floor.
      # Re-enable after raising Service Quotas -> Lambda -> Concurrent
      # executions, which also lifts the 10-invocation ceiling this whole
      # stack currently shares between the SSR and backend functions.
      Environment:
        Variables:
          NODE_ENV: production
          PORT: '3001'
          # Table reads/writes go to RDS; Storage and Auth still go to
          # Supabase until those phases land.
          DB_DRIVER: postgres
          # The proxy endpoint, not the instance endpoint - pointing at the
          # instance would bypass the pool and reintroduce the per-invocation
          # connection storm the proxy exists to prevent.
          DB_HOST: !GetAtt DbProxy.Endpoint
          DB_PORT: !GetAtt Database.Endpoint.Port
          DB_NAME: !Ref DbName
          DB_USER: app_user
          # Resolved by CloudFormation at deploy time, so the password is
          # never in the template, the repo or a shell history. Note this is
          # a deploy-time read: rotating the secret needs a stack update to
          # take effect.
          DB_PASSWORD: !Sub '{{resolve:secretsmanager:${AppUserSecret}:SecretString:password}}'
          # One Lambda container serves one request at a time, and RDS Proxy
          # is doing the real pooling, so a large local pool buys nothing.
          DB_POOL_MAX: '2'
          SUPABASE_URL: !Ref SupabaseUrl
          SUPABASE_SERVICE_ROLE_KEY: !Ref SupabaseServiceRoleKey
          SUPABASE_ANON_KEY: !Ref SupabaseAnonKey
          FRONTEND_URL: !If
            - HasFrontendUrl
            - !Ref FrontendUrl
            - !Sub 'https://${Distribution.DomainName}'
          # Deliberately 'false': node-cron cannot work on Lambda. The daily
          # tick arrives from EventBridge instead (see DailyTickRule).
          ENABLE_SCHEDULER: 'false'
          # Requests must carry this header, which only CloudFront adds.
          # Without it the execute-api URL is a way around every WAF rule.
          ORIGIN_VERIFY_SECRET: !Sub '{{resolve:secretsmanager:${OriginVerifySecret}:SecretString:value}}'
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
      # Placeholder only. The real package is ~23MB (Express app + production
      # node_modules), far past the 4KB inline ZipFile limit, so it is pushed
      # separately and CloudFormation never sees it:
      #
      #   cd backend && npm run package:lambda
      #   aws lambda update-function-code --function-name <project>-backend \
      #       --zip-file fileb://lambda.zip
      #
      # Note the Handler above points at dist/lambda.handler, which this
      # placeholder does not provide - the function only works once the real
      # package is pushed.
      Code:
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 503,
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              error: 'Backend package not deployed',
              hint: 'Run: cd backend && npm run package:lambda, then aws lambda update-function-code',
            }),
          });

  # ----------------------------------------------------------------------
  # Migration Lambda - loads the ported schema into RDS.
  #
  # RDS sits in private subnets with no inbound route, so nothing outside
  # the VPC can reach it - including a developer laptop. Running schema
  # changes from a Lambda inside the VPC is the only path in.
  #
  # Created here with placeholder code; the real bundle (pg driver +
  # schema.sql) is pushed afterwards with `aws lambda update-function-code`,
  # because it needs node_modules and so cannot be inlined as ZipFile.
  # ----------------------------------------------------------------------

  MigrationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-migrate'
      RetentionInDays: 14

  MigrationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: read-db-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Scoped to this database's two secrets only. The master secret
              # is needed to run DDL; the app_user secret is needed to CREATE
              # ROLE with the password CloudFormation generated.
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !GetAtt Database.MasterUserSecret.SecretArn
                  - !Ref AppUserSecret

  MigrationFunction:
    Type: AWS::Lambda::Function
    DependsOn: MigrationLogGroup
    Properties:
      FunctionName: !Sub '${ProjectName}-migrate'
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt MigrationRole.Arn
      # Schema load touches ~48 migrations worth of DDL in one transaction.
      Timeout: 300
      MemorySize: 512
      Environment:
        Variables:
          DB_HOST: !GetAtt Database.Endpoint.Address
          DB_PORT: !GetAtt Database.Endpoint.Port
          DB_NAME: !Ref DbName
          DB_SECRET_ARN: !GetAtt Database.MasterUserSecret.SecretArn
          APP_USER_SECRET_ARN: !Ref AppUserSecret
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
      Code:
        ZipFile: |
          exports.handler = async () => ({
            ok: false,
            note: 'Placeholder. Real bundle is pushed via update-function-code.'
          });

  # ----------------------------------------------------------------------
  # Static site bucket - private, reachable only through CloudFront OAC.
  #
  # Replaces the original SSR Lambda origin. This app is a client-rendered
  # Vite SPA with no SSR framework, so there is nothing to render on the
  # server - the SSR Lambda was a stub. Serving the built assets from S3 is
  # cheaper (no invocation per page view), removes a Lambda (this account's
  # concurrency limit is only 10), and avoids SigV4 signing against a Lambda
  # Function URL, which is what returned 403 on the first deploy.
  # ----------------------------------------------------------------------

  SiteBucket:
    Type: AWS::S3::Bucket
    # Assets are rebuildable from git, so let the stack clean this up. Note
    # the bucket must be emptied before a stack delete will succeed.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub '${ProjectName}-site-${AWS::AccountId}'
      # No public access at all - CloudFront OAC is the only reader.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Only this distribution may read, and only over TLS.
          - Sid: AllowCloudFrontOacRead
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

  # ----------------------------------------------------------------------
  # API Gateway HTTP API - proxy route, Cognito JWT authorizer
  # ----------------------------------------------------------------------

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-api'
      ProtocolType: HTTP

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito-jwt
      AuthorizerType: JWT
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
        Audience: [!Ref UserPoolClient]

  BackendIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt BackendFunction.Arn
      PayloadFormatVersion: '2.0'

  ProxyRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'ANY /{proxy+}'
      # With ApiAuthMode=application this drops to NONE and the Express
      # authenticate middleware is the only gate - the same arrangement the
      # app runs under on Render today. The Cognito authorizer cannot be left
      # on before the auth migration: it validates Cognito-issued tokens, and
      # the frontend still sends Supabase ones, so every call would 401.
      AuthorizationType: !If [UseCognitoAuthorizer, JWT, NONE]
      AuthorizerId: !If [UseCognitoAuthorizer, !Ref JwtAuthorizer, !Ref 'AWS::NoValue']
      Target: !Sub 'integrations/${BackendIntegration}'

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  # --------------------------------------------------------------------
  # Daily tick.
  #
  # On Render this is node-cron inside the always-on process. A Lambda is
  # frozen between invocations, so a cron timer inside it would never fire
  # and invoice reminders, contract/document expiry alerts and leave-return
  # reactivations would stop without any error to notice. EventBridge invokes
  # the same function instead; lambda.ts routes aws.events to runDailyTick().
  # --------------------------------------------------------------------

  DailyTickRule:
    Type: AWS::Events::Rule
    Condition: SchedulerEnabled
    Properties:
      Name: !Sub '${ProjectName}-daily-tick'
      Description: Invoice reminders, expiry alerts and leave-return reactivation
      # 02:00 UTC, matching the cron expression it replaces.
      ScheduleExpression: 'cron(0 2 * * ? *)'
      State: ENABLED
      Targets:
        - Id: backend
          Arn: !GetAtt BackendFunction.Arn

  DailyTickPermission:
    Type: AWS::Lambda::Permission
    Condition: SchedulerEnabled
    Properties:
      FunctionName: !GetAtt BackendFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt DailyTickRule.Arn

  BackendApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt BackendFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/{proxy+}'

  # ----------------------------------------------------------------------
  # WAF (CLOUDFRONT scope - us-east-1 only)
  # ----------------------------------------------------------------------

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${ProjectName}-web-acl'
      Scope: CLOUDFRONT
      DefaultAction: {Allow: {}}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${ProjectName}-web-acl'
      Rules:
        - Name: RateLimitPerIp
          Priority: 0
          Action: {Block: {}}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPer5Min
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPerIp

        - Name: CommonRuleSet
          Priority: 1
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSet

        - Name: KnownBadInputs
          Priority: 2
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: KnownBadInputs

        - Name: IpReputation
          Priority: 3
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: IpReputation

  # ----------------------------------------------------------------------
  # CloudFront
  # ----------------------------------------------------------------------

  SiteHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${ProjectName}-site-headers'
        Comment: Security headers for the SPA shell served from S3
        SecurityHeadersConfig:
          StrictTransportSecurity:
            # Two years, subdomains included. Not preloaded: preload is
            # effectively irreversible, and this stack may yet move domains.
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          XSSProtection:
            # 0, deliberately: the legacy XSS auditor is deprecated and its
            # filter introduced its own vulnerabilities. CSP does this job.
            Protection: false
            ModeBlock: false
            Override: true
          ContentSecurityPolicy:
            # connect-src must include Supabase: the SPA talks to Supabase
            # Auth directly for session refresh. 'unsafe-inline' on styles is
            # required by the Tailwind/Radix runtime style injection.
            ContentSecurityPolicy: >-
              default-src 'self';
              base-uri 'self';
              object-src 'none';
              frame-ancestors 'none';
              img-src 'self' data: blob: https:;
              font-src 'self' data: https:;
              style-src 'self' 'unsafe-inline' https:;
              script-src 'self';
              connect-src 'self' https://*.supabase.co;
              form-action 'self';
              upgrade-insecure-requests
            Override: true

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-site-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName} edge'
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        WebACLId: !GetAtt WebAcl.Arn
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true

        Origins:
          # Private S3 bucket, read only by this distribution via OAC.
          # S3OriginConfig with an empty OriginAccessIdentity is required
          # alongside OAC - CloudFront rejects the origin without it.
          - Id: s3-site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''

          - Id: http-api
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            # Only CloudFront knows this value, so the backend can tell a
            # request that came through the CDN (and therefore through WAF)
            # from one aimed straight at the execute-api URL.
            OriginCustomHeaders:
              - HeaderName: x-origin-verify
                HeaderValue: !Sub '{{resolve:secretsmanager:${OriginVerifySecret}:SecretString:value}}'

        # Single-page app: any path that is not a real file must return
        # index.html so React Router can resolve the route in the browser.
        # A private S3 bucket answers a missing key with 403 (not 404),
        # because the OAC policy grants GetObject but not ListBucket - so
        # both have to be mapped.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

        DefaultCacheBehavior:
          TargetOriginId: s3-site
          ViewerProtocolPolicy: redirect-to-https
          # helmet sets these on API responses, but the SPA shell is served
          # straight from S3 and never touches Express - so without this the
          # HTML document itself had no HSTS, no framing protection and no
          # nosniff.
          ResponseHeadersPolicyId: !Ref SiteHeadersPolicy
          # Static assets are read-only; no write methods reach the bucket.
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          # Managed-CachingOptimized. The old CachingDisabled made sense for
          # dynamic SSR output, but for fingerprinted static assets it would
          # mean paying an S3 GET on every request. This honours the
          # Cache-Control headers set at upload time: immutable for
          # /assets/*, no-cache for index.html.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # No origin request policy: forwarding viewer headers to an
          # OAC-signed S3 origin breaks the SigV4 signature.

        CacheBehaviors:
          - PathPattern: '/api/*'
            TargetOriginId: http-api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  # ----------------------------------------------------------------------
  # Route 53 - created only once DomainName + HostedZoneId are supplied
  # ----------------------------------------------------------------------

  AliasRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasHostedZone
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        # Fixed CloudFront hosted zone ID - the same in every region.
        HostedZoneId: Z2FDTNDATAQYW2
        EvaluateTargetHealth: false

Outputs:
  SiteUrl:
    Description: Public entry point
    Value: !If
      - HasDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${Distribution.DomainName}'

  DistributionId:
    Value: !Ref Distribution

  SiteBucketName:
    Description: Upload the built SPA (dist/) here, then invalidate the distribution
    Value: !Ref SiteBucket

  ApiEndpoint:
    Description: Direct API endpoint - reachable only via CloudFront in practice
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'

  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address

  DatabaseProxyEndpoint:
    Description: RDS Proxy endpoint - what the backend connects to
    Value: !GetAtt DbProxy.Endpoint

  AppUserSecretArn:
    Description: Secret holding the app_user database credentials
    Value: !Ref AppUserSecret

  DatabaseSecretArn:
    Description: RDS-managed master password secret
    Value: !GetAtt Database.MasterUserSecret.SecretArn

  UserPoolId:
    Value: !Ref UserPool

  UserPoolClientId:
    Value: !Ref UserPoolClient
